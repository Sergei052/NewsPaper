{% extends 'default.html' %}

{% block title %}Удалить статью{% endblock %}

{% block content %}
    <h1 class="mb-4">Удалить статью</h1>

    <div class="alert alert-danger">
        <p><strong>Вы уверены, что хотите удалить эту статью?</strong></p>
        <p><strong>Название:</strong> {{ object.postTitle }}</p>
        <p class="text-muted mb-0">Это действие не может быть отменено.</p>
    </div>

    <form method="post">
        {% csrf_token %}
        <div class="d-flex gap-2">
            <button type="submit" class="btn btn-danger">Да, удалить</button>
            <a href="{% url 'news:articles_list' %}" class="btn btn-secondary">Отменить</a>
        </div>
    </form>
{% endblock %}
