{% extends 'default.html' %}

{% block title %}Удалить новость{% endblock %}

{% block content %}
    <h1 class="mb-4">Удалить новость</h1>

    <div class="alert alert-danger">
        <p><strong>Вы уверены, что хотите удалить эту новость?</strong></p>
        <p><strong>Название:</strong> {{ object.postTitle }}</p>
        <p class="text-muted">Это действие не может быть отменено.</p>
    </div>

    <form method="post">
        {% csrf_token %}
        <div class="d-flex gap-2">
            <button type="submit" class="btn btn-danger">Да, удалить</button>
            <a href="{% url 'news:list' %}" class="btn btn-secondary">Отменить</a>
        </div>
    </form>
{% endblock %}
